services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer_container
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    environment:
      - TZ=America/Sao_Paulo
volumes:
  portainer-data:
    driver: local